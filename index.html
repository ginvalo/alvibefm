<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AL VIBE FM - Online Radio 24/7</title>
<style>
  :root {
    --bg: #030712;
    --card: rgba(15, 23, 42, 0.85);
    --card-border: rgba(232, 185, 35, 0.25);
    --gold: #e8b923;
    --gold-light: #f5d76e;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #030712;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-image: url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1400&q=80');
    background-size: cover;
    background-position: center bottom;
    background-attachment: fixed;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(3, 7, 18, 0.92);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 18px 32px;
  }

  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0 12px;
  }

  /* Tyylikäs kultainen kello ilman sekunteja */
  .digital-clock {
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(232, 185, 35, 0.5);
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
  }

  .header {
    text-align: center;
    padding: 4px 0 16px;
  }

  /* Uusi Online Radio -teksti mikrofonin tilalla */
  .online-radio-tag {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 0 8px rgba(232, 185, 35, 0.4);
  }

  .logo {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .logo .al { color: #ffffff; text-shadow: 0 0 12px rgba(255,255,255,0.3); }
  .logo .vibe { color: #ffffff; }
  .logo .fm { color: var(--gold); }

  .tagline {
    font-size: 11px;
    letter-spacing: 2.5px;
    color: #94a3b8;
    text-transform: uppercase;
  }

  .player-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(16px);
  }

  .player-hero {
    height: 130px;
    background-image: linear-gradient(to bottom, rgba(3, 7, 18, 0.2), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&q=80');
    background-size: cover;
    background-position: center;
    position: relative;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .live-pill {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .live-pill .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
  }

  .live-pill.active .live-dot {
    background: #ef4444;
    box-shadow: 0 0 8px #ef4444;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.8; }
  }

  .back-to-live-btn {
    background: rgba(232, 185, 35, 0.9);
    color: #030712;
    border: none;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    display: none;
    box-shadow: 0 0 10px rgba(232, 185, 35, 0.5);
    transition: transform 0.2s;
  }
  .back-to-live-btn:hover { transform: scale(1.05); }

  .player-controls-row {
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .track-meta {
    flex: 1;
    min-width: 0;
    padding-right: 12px;
  }

  .track-meta .label {
    font-size: 10px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .track-meta h3 {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }

  .track-meta .sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .fav-btn {
    font-size: 12px;
    color: var(--gold-light);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    user-select: none;
  }

  .main-play-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f5d76e, #e8b923);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(232, 185, 35, 0.4);
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .main-play-btn:active { transform: scale(0.95); }
  .main-play-btn svg { width: 22px; height: 22px; fill: #030712; }

  .section-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--text);
    margin: 16px 0 10px;
    border-bottom: 2px solid var(--gold);
    width: fit-content;
    padding-bottom: 2px;
  }

  .schedule-list { display: flex; flex-direction: column; gap: 8px; }

  .schedule-card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
  }

  .schedule-card.active {
    border-color: var(--card-border);
    background: rgba(15, 23, 42, 0.95);
  }

  .schedule-time { color: var(--gold); font-weight: 700; width: 95px; font-size: 12px; }
  .schedule-name { font-weight: 600; flex: 1; color: #fff; }
  
  .badge-onair {
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .badge-upcoming {
    color: var(--muted);
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .top-list { display: flex; flex-direction: column; gap: 8px; }

  .top-card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .top-card:hover { border-color: var(--gold); }
  .top-rank { font-weight: 800; color: var(--gold); width: 20px; text-align: center; }
  .top-title { flex: 1; font-weight: 600; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .heart-btn {
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  .heart-btn:hover { transform: scale(1.15); }
  .heart-btn.voted { color: #ef4444; }

  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 24px 0 10px;
    line-height: 1.6;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: none;
    justify-content: flex-end;
  }

  .menu-panel {
    background: #0f172a;
    width: 240px;
    height: 100%;
    padding: 20px;
    border-left: 1px solid var(--card-border);
  }

  .menu-panel h4 { color: var(--gold); margin-bottom: 20px; }
  .menu-panel a { display: block; color: #fff; text-decoration: none; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
</style>
</head>
<body>

<div class="container">
  
  <div class="top-nav">
    <div class="digital-clock" id="clock">--:--</div>
    <button class="icon-btn" onclick="toggleMenu()">☰</button>
  </div>

  <div class="header">
    <div class="online-radio-tag">ONLINE RADIO</div>
    <div class="logo">
      <span class="al">AL</span> <span class="vibe">VIBE</span> <span class="fm">FM</span>
    </div>
    <div class="tagline">YOUR RHYTHM. YOUR MUSIC.</div>
  </div>

  <div class="player-card">
    <div class="player-hero">
      <div class="live-pill active" id="livePill" onclick="switchToLiveStream()">
        <span class="live-dot"></span> LIVE
      </div>
      <button class="back-to-live-btn" id="backToLiveBtn" onclick="switchToLiveStream()">↺ Back to Live</button>
    </div>
    <div class="player-controls-row">
      <div class="track-meta">
        <div class="label" id="playerLabel">NOW PLAYING</div>
        <h3 id="trackTitle">Press Play to Start</h3>
        <div class="sub" id="trackSub">AL VIBE FM • 24/7 STREAM</div>
        <div class="fav-btn" onclick="addCurrentToFav()">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          Add to Favorites
        </div>
      </div>
      <button class="main-play-btn" id="playBtn">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>

  <div class="section-title">TODAY'S SCHEDULE</div>
  <div class="schedule-list" id="scheduleList"></div>

  <div class="section-title">TOP 20</div>
  <div class="top-list" id="topList"></div>

  <div class="footer">
    AL VIBE FM • 24/7 Online Radio<br>
    All rights reserved by GINVALO
  </div>

</div>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()">
  <div class="menu-panel" onclick="event.stopPropagation()">
    <h4>AL VIBE FM</h4>
    <a href="#" onclick="switchToLiveStream(); toggleMenu();">24/7 Live Stream</a>
    <a href="#" onclick="toggleMenu();">Schedule</a>
    <a href="#" onclick="toggleMenu();">Top 20</a>
  </div>
</div>

<script>
const songs = [
  { id: 1, title: "Étoiles Dans Les Yeux", votes: 120, src: "https://archive.org/download/al-vibe-fm_20261029_1428/%C3%89toiles%20Dans%20Les%20Yeux.mp3" },
  { id: 2, title: "Batumi Nights", votes: 110, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Batumi%20Nights.mp3" },
  { id: 3, title: "All Roads Lead To Disco", votes: 95, src: "https://archive.org/download/al-vibe-fm_20261029_1428/All%20Roads%20Lead%20To%20Disco.mp3" },
  { id: 4, title: "Beyonce The Fog", votes: 88, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Beyonce%20The%20Fog.mp3" },
  { id: 5, title: "Brilla", votes: 82, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Brilla.mp3" },
  { id: 6, title: "Call From The Deep", votes: 79, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Call%20From%20The%20Deep.mp3" },
  { id: 7, title: "Carousel Of Power", votes: 75, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Carousel%20Of%20Power.mp3" },
  { id: 8, title: "Celebramos La Vida", votes: 71, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Celebramos%20La%20Vida.mp3" },
  { id: 9, title: "Chop Chop Lollipop", votes: 68, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Chop%20Chop%20Lollipop.mp3" },
  { id: 10, title: "Deluvision", votes: 64, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Deluvision.mp3" },
  { id: 11, title: "Don't Go", votes: 60, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Don%27t%20Go.mp3" },
  { id: 12, title: "Dream Way", votes: 55, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Dream%20Way.mp3" },
  { id: 13, title: "Every Day Like A Prize", votes: 51, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Every%20Day%20Like%20A%20Prize.mp3" },
  { id: 14, title: "Feel The Power", votes: 48, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Feel%20The%20Power.mp3" },
  { id: 15, title: "Good Life", votes: 44, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Good%20Life.mp3" },
  { id: 16, title: "Gravity", votes: 40, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Gravity.mp3" },
  { id: 17, title: "Heartbeat Anthem", votes: 36, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Heartbeat%20Anthem.mp3" },
  { id: 18, title: "I WANNA FEEL", votes: 32, src: "https://archive.org/download/al-vibe-fm_20261029_1428/I%20WANNA%20FEEL.mp3" },
  { id: 19, title: "Ibiza Stole My Soul", votes: 28, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Ibiza%20Stole%20My%20Soul.mp3" },
  { id: 20, title: "Sunshine", votes: 25, src: "https://archive.org/download/al-vibe-fm_20261029_1428/Sunshine.mp3" }
];

const jingles = [
  "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%201.mp3",
  "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%202.mp3",
  "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%203.mp3",
  "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%204.mp3", // Index 3: Spēlējas katras stundas sākumā (00:00)
  "https://archive.org/download/al-vibe.-fm/Al%20Vibe%20Fm%205.mp3",
  "https://archive.org/download/al-vibe.-fm/Al%20Vibe.%20Fm%206.mp3"
];

const schedule = [
  { start: 7, end: 11, name: "VIBE MORNING" },
  { start: 11, end: 17, name: "VIBE DAYTIME" },
  { start: 17, end: 20, name: "VIBE DRIVE" },
  { start: 20, end: 22, name: "VIBE EVENING" },
  { start: 22, end: 23, name: "VIBE LOVE/LOUNGE" },
  { start: 23, end: 2, name: "VIBE CLUB" },
  { start: 2, end: 7, name: "VIBE AFTER DARK" }
];

let currentAudio = new Audio();
let nextAudio = new Audio();
let isLiveMode = true;
let liveSongIndex = 0;
let songCountForJingle = 0;
let jingleIndex = 0;
let nextItemCache = null;

currentAudio.preload = "auto";
nextAudio.preload = "auto";

// Kellon päivitys (ilman sekunteja: HH:MM)
function updateClock() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = `${hours}:${minutes}`;
  
  const currentHour = now.getHours();
  const scheduleContainer = document.getElementById('scheduleList');
  scheduleContainer.innerHTML = '';

  schedule.forEach(item => {
    let isActive = (item.start < item.end) ? 
      (currentHour >= item.start && currentHour < item.end) : 
      (currentHour >= item.start || currentHour < item.end);

    const startStr = (item.start < 10 ? '0' : '') + item.start + ':00';
    const endStr = (item.end < 10 ? '0' : '') + item.end + ':00';

    const card = document.createElement('div');
    card.className = `schedule-card ${isActive ? 'active' : ''}`;
    card.innerHTML = `
      <span class="schedule-time">${startStr}–${endStr}</span>
      <span class="schedule-name">${item.name}</span>
      ${isActive ? `<span class="badge-onair">((•)) ON AIR</span>` : `<span class="badge-upcoming">UPCOMING</span>`}
    `;
    scheduleContainer.appendChild(card);
  });
}
setInterval(updateClock, 1000);
updateClock();

function renderTopList() {
  songs.sort((a, b) => b.votes - a.votes);
  const container = document.getElementById('topList');
  container.innerHTML = '';
  const today = new Date().toISOString().slice(0, 10);

  songs.forEach((song, index) => {
    const hasVoted = localStorage.getItem(`voted_${song.id}_${today}`) === 'true';
    const card = document.createElement('div');
    card.className = 'top-card';
    card.onclick = () => playOnDemand(song);

    card.innerHTML = `
      <span class="top-rank">${index + 1}.</span>
      <span class="top-title">${song.title}</span>
      <button class="heart-btn ${hasVoted ? 'voted' : ''}" onclick="voteForSong(event, ${song.id})">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    `;
    container.appendChild(card);
  });
}
renderTopList();

function voteForSong(event, id) {
  event.stopPropagation();
  const today = new Date().toISOString().slice(0, 10);
  const key = `voted_${id}_${today}`;

  if (localStorage.getItem(key)) {
    alert("You have already voted for this song today!");
    return;
  }

  const song = songs.find(s => s.id === id);
  if (song) {
    song.votes += 1;
    localStorage.setItem(key, 'true');
    renderTopList();
  }
}

// TARKKA JINGLE- JA ETERI-LOGIIKKA
function getNextTrack() {
  const now = new Date();
  
  // 1. Tasatunti: 4. jingle soi aina stundas sākumā (00 minuutilla)
  if (now.getMinutes() === 0 && !currentAudio.src.includes("Jingle")) {
    return { title: "AL VIBE FM JINGLE", src: jingles[3], isJingle: true };
  } 
  // 2. Joka 4. biisin jälkeen soi jingle
  else if (songCountForJingle >= 4) {
    let src = jingles[jingleIndex];
    jingleIndex = (jingleIndex + 1) % jingles.length;
    songCountForJingle = 0; // Nollataan biisilaskuri jinglen jälkeen
    return { title: "AL VIBE FM JINGLE", src: src, isJingle: true };
  } 
  // 3. Tavanomainen musiikkiraita
  else {
    let song = songs[liveSongIndex];
    liveSongIndex = (liveSongIndex + 1) % songs.length;
    songCountForJingle++; // Kasvatetaan laskuria vain kun soitettaisiin kappale
    return { title: song.title, src: song.src, isJingle: false };
  }
}

function preloadNextTrack() {
  nextItemCache = getNextTrack();
  nextAudio.src = nextItemCache.src;
  nextAudio.load();
}

function updateMediaSession(title) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title,
      artist: 'AL VIBE FM',
      album: '24/7 Live Stream'
    });
    navigator.mediaSession.setActionHandler('play', () => currentAudio.play());
    navigator.mediaSession.setActionHandler('pause', () => currentAudio.pause());
  }
}

function updateUI(title, isJingle = false) {
  document.getElementById('trackTitle').textContent = title;
  document.getElementById('trackSub').textContent = isJingle ? "AL VIBE FM • JINGLE" : (isLiveMode ? "AL VIBE FM • 24/7 STREAM" : "AL VIBE FM • ON DEMAND");
  document.getElementById('playerLabel').textContent = isLiveMode ? "NOW PLAYING" : "ON DEMAND";
  
  const livePill = document.getElementById('livePill');
  const backToLiveBtn = document.getElementById('backToLiveBtn');

  if (isLiveMode) {
    livePill.classList.add('active');
    backToLiveBtn.style.display = 'none';
  } else {
    livePill.classList.remove('active');
    backToLiveBtn.style.display = 'inline-block';
  }

  const playIcon = document.getElementById('playIcon');
  if (currentAudio.paused) {
    playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
  } else {
    playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
  }

  updateMediaSession(title);
}

function playStream() {
  if (!nextItemCache) {
    nextItemCache = getNextTrack();
  }
  
  currentAudio.src = nextItemCache.src;
  updateUI(nextItemCache.title, nextItemCache.isJingle);
  
  currentAudio.play().then(() => {
    preloadNextTrack();
  }).catch(e => {
    console.log("Autoplay waiting for user click");
  });
}

currentAudio.onended = () => {
  if (isLiveMode) {
    currentAudio.src = nextAudio.src;
    updateUI(nextItemCache.title, nextItemCache.isJingle);
    currentAudio.play();
    preloadNextTrack();
  } else {
    switchToLiveStream();
  }
};

currentAudio.onerror = () => {
  console.log("Audio error caught, recovering stream...");
  setTimeout(() => {
    if (isLiveMode) playStream();
  }, 2000);
};

document.getElementById('playBtn').onclick = () => {
  if (currentAudio.paused) {
    if (!currentAudio.src) {
      playStream();
    } else {
      currentAudio.play();
    }
  } else {
    currentAudio.pause();
  }
  updateUI(document.getElementById('trackTitle').textContent);
};

function playOnDemand(song) {
  isLiveMode = false;
  currentAudio.src = song.src;
  currentAudio.play();
  updateUI(song.title);
}

function switchToLiveStream() {
  isLiveMode = true;
  nextItemCache = null;
  playStream();
}

function toggleMenu() {
  const menu = document.getElementById('menuOverlay');
  menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
}

function addCurrentToFav() {
  alert("Added to your favorites!");
}
</script>

</body>
</html>
