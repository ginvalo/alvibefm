<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL VIBE FM — 24/7 Radio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .badge {
            display: inline-block;
            background: #ff007f;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }
        .mode-tag {
            font-size: 0.85rem;
            color: #00f2fe;
            margin-bottom: 20px;
            font-weight: 600;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .track-info {
            margin-bottom: 25px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .track-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #e0e0e0;
            word-break: break-word;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn {
            background: #7928ca;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
        }
        .btn:hover {
            background: #ff007f;
            transform: scale(1.05);
        }
        .btn-main {
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        audio {
            width: 100%;
            margin-top: 10px;
            filter: invert(100%) hue-rotate(180deg);
        }
        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">AL VIBE FM</div>
        <div class="badge">● TIEŠRAIDE 24/7</div>
        <div class="mode-tag" id="modeTag">🔀 RANDOM REŽĪMS</div>

        <div class="track-info">
            <div class="track-title" id="trackName">Gatavo mūziku...</div>
        </div>

        <div class="controls">
            <button class="btn btn-main" id="playBtn" onclick="togglePlay()">▶ Atskaņot</button>
            <button class="btn" onclick="nextRandomTrack()">Nākamā ⏭</button>
        </div>

        <audio id="audioPlayer" controls preload="auto"></audio>
        <!-- Slēptais atskaņotājs nākamās dziesmas fona ielādei, lai nebūtu paužu -->
        <audio id="nextAudioPlayer" preload="auto" style="display:none;"></audio>
    </div>

    <footer>&copy; 2026 AL VIBE FM — Visas tiesības aizsargātas</footer>

    <script>
        const baseUrl = "https://archive.org/download/al-vibe-fm-playlist/";

        const playlist = [
            { title: "All Roads Lead To Disco", file: "All%20Roads%20Lead%20To%20Disco.mp3" },
            { title: "Beyonce The Fog (Dream Trance Remix)", file: "Beyonce%20The%20Fog.%20Dream%20Trance%20Remix.wav" },
            { title: "Beyonce The Fog (Original Remix)", file: "Beyonce%20The%20Fog.Original%20Remix.wav" },
            { title: "Beyonce The Fog", file: "Beyonce%20The%20Fog.mp3" },
            { title: "Celebramos La Vida", file: "Celebramos%20La%20Vida.mp3" },
            { title: "Chop Chop Lollipop", file: "Chop%20Chop%20Lollipop.mp3" },
            { title: "Deluvision", file: "Deluvision.mp3" },
            { title: "Dream Way", file: "Dream%20Way.mp3" },
            { title: "Étoiles Dans Les Yeux", file: "%C3%89toiles%20Dans%20Les%20Yeux.mp3" },
            { title: "Every Day Like A Prize", file: "Every%20Day%20Like%20A%20Prize.mp3" },
            { title: "Feel The Power (Original Remix)", file: "Feel%20The%20Power%20Original%20Remix.mp3" },
            { title: "Good Life (Instrumental)", file: "Good%20Life%20Instrumental.wav" },
            { title: "Heartbeat Anthem", file: "Heartbeat%20Anthem.mp3" },
            { title: "Hey Hey Hey", file: "Hey%20Hey%20Hey.mp3" },
            { title: "I Fall In My Dreams", file: "I%20Fall%20In%20My%20Dreams.mp3" },
            { title: "I'll Make It Anyway", file: "I%27ll%20Make%20It%20Anyway.mp3" },
            { title: "In That Summer", file: "In%20That%20Summer.mp3" },
            { title: "Infinitra", file: "Infinitra.mp3" },
            { title: "MAGIC AMULET", file: "MAGIC%20AMULET.mp3" },
            { title: "Mars", file: "Mars.mp3" },
            { title: "Miami Beach Remix", file: "Miami%20Beach%20Remix.mp3" },
            { title: "Mirror Games (Instrumental)", file: "Mirror%20Games.Instrumental.mp3" },
            { title: "Mirror Games", file: "Mirror%20Games.mp3" },
            { title: "NIGHTLIFE", file: "NIGTLIFE.mp3" },
            { title: "Night Dreams", file: "Night%20Dreams.mp3" },
            { title: "Night Lounge", file: "Night%20Lounge.mp3" },
            { title: "Night Walk", file: "Night%20Walk.mp3" },
            { title: "Night Song", file: "Night%20song.mp3" },
            { title: "No Brakes", file: "No%20Brakes.mp3" },
            { title: "No Call, No Goodbye", file: "No%20Call%2CNo%20Goodbye.mp3" },
            { title: "Noctivibe", file: "Noctivibe.mp3" },
            { title: "Party All Night", file: "Party%20All%20Night.mp3" },
            { title: "Phoryn (Instrumental)", file: "Phoryn.Instrumental.mp3" },
            { title: "Phoryn", file: "Phoryn.mp3" },
            { title: "Random", file: "Random.mp3" },
            { title: "Rise Unbound", file: "Rise%20Unbound.mp3" },
            { title: "Shadows Without You", file: "Shadows%20Without%20You.mp3" },
            { title: "Shine So Bright!", file: "Shine%20So%20Bright%20%21.mp3" },
            { title: "Somewhere In Silence", file: "Somewhere%20in%20silence.mp3" },
            { title: "Soul Tide (Instrumental)", file: "Soul%20Tide%20Instrumental.mp3" },
            { title: "Soul Tide", file: "Soul%20Tide.mp3" },
            { title: "Sprin", file: "Sprin.mp3" },
            { title: "Stay The Same", file: "Stay%20The%20Same.mp3" },
            { title: "Still I Stay", file: "Still%20I%20Stay.mp3" },
            { title: "Summer Rings", file: "Summer%20Rings.mp3" },
            { title: "Sunglasses & Sunlight", file: "Sunglasses%20%26%20Sunlight.mp3" },
            { title: "Sunrise In My Soul", file: "Sunrise%20In%20My%20Soul.wav" },
            { title: "Sunshine", file: "Sunshine.mp3" },
            { title: "THEY", file: "THEY.mp3" },
            { title: "Test", file: "Test.mp3" },
            { title: "To The Moon", file: "To%20The%20Moon.mp3" },
            { title: "Tropical House", file: "Tropical%20House.mp3" },
            { title: "UNKNOWN", file: "UNKNOWN.mp3" },
            { title: "Under My Wings", file: "Under%20My%20Wings.mp3" },
            { title: "Unfelt (Instrumental)", file: "Unfelt.%20Instrumental.mp3" },
            { title: "Unfelt", file: "Unfelt.mp3" },
            { title: "Walk In The Dark", file: "Walk%20In%20The%20Dark.mp3" },
            { title: "Walk", file: "Walk.mp3" },
            { title: "Waves and Wonder", file: "Waves%20and%20Wonder.mp3" },
            { title: "We Do What We Want", file: "We%20Do%20What%20We%20Want.mp3" },
            { title: "Weekendstate", file: "Weekendstate.mp3" },
            { title: "Wind In You", file: "Wind%20InYou.mp3" },
            { title: "You Stole My Heart", file: "You%20stole%20my%20hearth.mp3" }
        ];

        let currentTrackIndex = -1;
        let nextTrackIndex = -1;

        const player = document.getElementById('audioPlayer');
        const nextPlayer = document.getElementById('nextAudioPlayer');
        const trackName = document.getElementById('trackName');
        const playBtn = document.getElementById('playBtn');

        function getRandomIndex(excludeIndex) {
            let index;
            do {
                index = Math.floor(Math.random() * playlist.length);
            } while (index === excludeIndex && playlist.length > 1);
            return index;
        }

        function prepareNextTrack() {
            nextTrackIndex = getRandomIndex(currentTrackIndex);
            nextPlayer.src = baseUrl + playlist[nextTrackIndex].file;
        }

        function loadRandomTrack() {
            if (nextTrackIndex !== -1 && nextPlayer.src) {
                currentTrackIndex = nextTrackIndex;
                player.src = nextPlayer.src;
            } else {
                currentTrackIndex = getRandomIndex(-1);
                player.src = baseUrl + playlist[currentTrackIndex].file;
            }
            trackName.innerText = playlist[currentTrackIndex].title;
            prepareNextTrack();
        }

        function togglePlay() {
            if (player.paused) {
                if (!player.src) loadRandomTrack();
                player.play();
                playBtn.innerText = "⏸ Pauze";
            } else {
                player.pause();
                playBtn.innerText = "▶ Atskaņot";
            }
        }

        function nextRandomTrack() {
            loadRandomTrack();
            player.play();
            playBtn.innerText = "⏸ Pauze";
        }

        // Tiklīdz dziesma tuvojas beigām vai beidzas, uzreiz slēdz nākamo
        player.addEventListener('ended', () => {
            nextRandomTrack();
        });

        // Sākotnējā ielāde
        loadRandomTrack();
    </script>
</body>
</html>
