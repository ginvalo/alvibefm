<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL VIBE FM — Radio Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .radio-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .station-title { font-size: 2.2rem; letter-spacing: 2px; color: #ff007f; margin-bottom: 5px; }
        .tagline { font-size: 0.85rem; color: #aaa; letter-spacing: 1px; margin-bottom: 25px; text-transform: uppercase; }
        
        .track-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 1rem;
            color: #00f2fe;
        }

        .controls button {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            color: #fff;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.4);
        }
        .controls button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="radio-card">
        <h1 class="station-title">AL VIBE FM</h1>
        <div class="tagline">ARCHIVE.ORG STREAM TEST</div>
        
        <div class="track-box" id="status-text">
            Spied PLAY, lai atskaņotu...
        </div>

        <div class="controls">
            <button id="play-btn" onclick="togglePlay()">PLAY</button>
        </div>
    </div>

    <!-- Tiešā saite uz Lost In The Night no tava Archive.org krājuma -->
    <audio id="audio-player" src="https://archive.org/download/al-vibe-fm/11%20Lost%20In%20The%20Night.mp3" preload="auto" crossorigin="anonymous"></audio>

<script>
const player = document.getElementById("audio-player");
const playBtn = document.getElementById("play-btn");
const statusText = document.getElementById("status-text");

function togglePlay() {
    if (player.paused) {
        statusText.innerText = "Ielādēju no Archive.org...";
        
        let playPromise = player.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                playBtn.innerText = "PAUSE";
                statusText.innerText = "Skan: Lost In The Night";
            }).catch(error => {
                console.log("Kļūda:", error);
                statusText.innerText = "Uzspied PLAY vēlreiz!";
                playBtn.innerText = "PLAY";
            });
        }
    } else {
        player.pause();
        playBtn.innerText = "PLAY";
        statusText.innerText = "Pauzēts";
    }
}

player.addEventListener("error", (e) => {
    console.log("Audio kļūda:", e);
    statusText.innerText = "Kļūda ielādējot failu!";
});
</script>

</body>
</html>
