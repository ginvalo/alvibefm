<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AL VIBE FM - Online Radio 24/7</title>
<meta name="description" content="AL VIBE FM — Your Rhythm. Your Music. 24/7 online radio.">
<style>
  :root {
    --bg: #030712;
    --card: rgba(15, 23, 42, 0.78);
    --card-border: rgba(232, 185, 35, 0.28);
    --gold: #e8b923;
    --gold-light: #f5d76e;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #030712;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-image: url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=1400&q=80');
    background-size: cover;
    background-position: center bottom;
    background-attachment: fixed;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(3, 7, 18, 0.90);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    padding: 12px 18px 32px;
  }

  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0 12px;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.08); }

  .clock {
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .header {
    text-align: center;
    padding: 6px 0 16px;
  }

  .logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .logo .al { color: #ffffff; text-shadow: 0 0 12px rgba(255,255,255,0.25); }
  .logo .vibe-container { position: relative; display: inline-block; }
  .logo .vibe { color: #f8fafc; }
  .logo .fm { color: var(--gold); margin-left: 4px; }

  .mic-icon {
    position: absolute;
    top: -16px;
    left: 22px;
    width: 13px;
    height: 13px;
    fill: var(--gold);
  }
  .waves-icon {
    position: absolute;
    top: -24px;
    left: 16px;
    width: 24px;
    height: 13px;
    fill: var(--gold);
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 2.2px;
    color: #94a3b8;
    text-transform: uppercase;
  }

  .now-playing {
    background: var(--card);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  }

  .album {
    width: 96px;
    height: 96px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f97316, #7c3aed);
    flex-shrink: 0;
    background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300&q=80');
    background-size: cover;
    background-position: center;
  }

  .track-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    min-width: 0;
  }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .track-info .label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  .live-badge {
    background: rgba(0,0,0,0.55);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 9px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--muted);
  }

  .live-dot { 
    width: 6px; 
    height: 6px; 
    background: #555; 
    border-radius: 50%; 
    transition: 0.3s;
  }

  .live-badge.active { color: #fff; }
  .live-badge.active .live-dot {
    background: #ef4444; 
    box-shadow: 0 0 8px #ef4444;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
  }

  .track-info h3 { 
    font-size: 16px; 
    font-weight: 700; 
    color: #fff; 
    line-height: 1.25; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
  }
  .track-info .meta { font-size: 10px; color: var(--muted); letter-spacing: 0.4px; margin-top: 3px; }
  .fav { 
    margin-top: 8px; 
    font-size: 12px; 
    color: var(--gold-light); 
    cursor: pointer; 
    display: inline-flex; 
    align-items: center; 
    gap: 4px;
    user-select: none;
  }
  .fav:hover { opacity: 0.85; }

  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 22px;
    gap: 10px;
  }

  .play-btn {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: rgba(232, 185, 35, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 18px rgba(232, 185, 35, 0.18);
  }
  .play-btn:hover { background: rgba(232,185,35,0.18); transform: scale(1.04); }
  .play-btn:active { transform: scale(0.98); }
  .play-btn svg { width: 26px; height: 26px; fill: var(--gold); margin-left: 3px; }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 160px;
    font-size: 11px;
    color: var(--muted);
  }
  .volume-row input[type="range"] {
    flex: 1;
    accent-color: var(--gold);
    height: 4px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.1px;
    margin: 14px 0 8px;
    color: var(--gold-light);
  }

  .schedule-item {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 11px 14px;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    transition: border-color 0.2s;
  }
  .schedule-item.active { border-color: rgba(232,185,35,0.45); }

  .schedule-item .time { color: var(--muted); min-width: 92px; font-size: 12px; }
  .schedule-item .name { font-weight: 600; letter-spacing: 0.2px; }

  .on-air {
    background: var(--gold);
    color: #030712;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 20px;
    display: none;
  }
  .schedule-item.active .on-air { display: inline-block; }

  .top-item {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 11px 12px;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
  }
  .top-item:hover {
    border-color: var(--gold);
    background: rgba(15, 23, 42, 0.92);
  }
  .rank { font-weight: 700; color: var(--gold); min-width: 22px; text-align: center; }
  .song { flex: 1; min-width: 0; }
  .song .title { font-weight: 600; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .vote-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    font-size: 14px;
    flex-shrink: 0;
  }
  .vote-btn.voted, .vote-btn:hover {
    background: var(--gold);
    color: #030712;
  }

  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 20px 0 8px;
    line-height: 1.5;
  }

  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    display: none;
    align-items: flex-start;
    justify-content: flex-start;
  }
  .menu-panel {
    background: rgba(15,23,42,0.95);
    border-radius: 0 16px 16px 0;
    padding: 20px;
    width: 220px;
    height: 100%;
    border-right: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
  }
  .menu-panel a {
    display: block;
    padding: 12px 0;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .menu-panel a:hover { color: var(--gold); }
</style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <button class="icon-btn" id="menuBtn">☰</button>
    <div class="clock" id="liveClock">00:00:00</div>
    <div style="width: 40px;"></div>
  </div>

  <div class="header">
    <div class="logo">
      <span class="al">AL</span> 
      <span class="vibe-container">
        <svg class="waves-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12h2c0-4.41 3.59-8 8-8s8 3.59 8 8h2c0-5.52-4.48-10-10-10zm0 4c-3.31 0-6 2.69-6 6h2c0-2.21 1.79-4 4-4s4 1.79 4 4h2c0-3.31-2.69-6-6-6z"/></svg>
        <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
        <span class="vibe">VİBE</span>
      </span> 
      <span class="fm">FM</span>
    </div>
    <div class="tagline">Your Rhythm. Your Music.</div>
  </div>

  <div class="now-playing">
    <div class="album" id="albumArt"></div>
    <div class="track-info">
      <div class="status-row">
        <div class="label">((•)) NOW PLAYING</div>
        <div class="live-badge" id="liveBadge"><span class="live-dot"></span> LIVE</div>
      </div>
      <h3 id="currentTrackTitle">Gaidiet atskaņošanu...</h3>
      <div class="meta" id="currentTrackMeta">AL VIBE FM • 24/7 STREAM</div>
      <div class="fav" id="favBtn">☆ Add to Favorites</div>
    </div>
  </div>

  <div class="controls">
    <div class="play-btn" id="playBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div class="volume-row">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
    </div>
  </div>

  <div class="section-title">📅 TODAY'S SCHEDULE</div>
  <div id="scheduleContainer"></div>

  <div class="section-title">≡ TOP 20</div>
  <div id="top20Container"></div>

  <div class="footer">
    AL VIBE FM • 24/7 Online Radio<br>
    Your Rhythm. Your Music.
  </div>
</div>

<div class="menu-overlay" id="menuOverlay">
  <div class="menu-panel">
    <div style="font-weight:700; color:var(--gold); padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:10px;">AL VIBE FM</div>
    <a href="#" onclick="closeMenu()">Sākums</a>
    <a href="#" onclick="closeMenu()">Par mums</a>
    <a href="#" onclick="closeMenu()">Kontakti</a>
  </div>
</div>

<script>
// Programmas grafiks
const scheduleData = [
  { start: 7, end: 11, name: "VIBE MORNING", time: "07:00–11:00" },
  { start: 11, end: 17, name: "VIBE DAYTIME", time: "11:00–17:00" },
  { start: 17, end: 20, name: "VIBE DRIVE", time: "17:00–20:00" },
  { start: 20, end: 22, name: "VIBE EVENING", time: "20:00–22:00" },
  { start: 22, end: 23, name: "VIBE LOVE/LOUNGE", time: "22:00–23:00" },
  { start: 23, end: 2, name: "VIBE CLUB", time: "23:00–02:00" },
  { start: 2, end: 7, name: "VIBE AFTER DARK", time: "02:00–07:00" }
];

const scheduleContainer = document.getElementById('scheduleContainer');
scheduleData.forEach(item => {
  const div = document.createElement('div');
  div.className = 'schedule-item';
  div.dataset.start = item.start;
  div.dataset.end = item.end;
  div.innerHTML = `<span class="time">${item.time}</span><span class="name">${item.name}</span><span class="on-air">ON AIR</span>`;
  scheduleContainer.appendChild(div);
});

// Džingli
const jingles = [
  { title: "Al Vibe Fm 1", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%201.mp3" },
  { title: "Al Vibe Fm 2", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%202.mp3" },
  { title: "Al Vibe Fm 3", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%203.mp3" },
  { title: "Al Vibe Fm 4", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%204.mp3" },
  { title: "Al Vibe Fm 5", src: "https://archive.org/download/al-vibe.-fm/Al%20Vibe%20Fm%205.mp3" },
  { title: "Al Vibe. Fm 6", src: "https://archive.org/download/al-vibe.-fm/Al%20Vibe.%20Fm%206.mp3" }
];

// Top 20 dziesmas (precīzi 20 gabali ar izlabotiem nosaukumiem)
const songs = [
  { title: "All Roads Lead To Disco", src: "https://archive.org/download/al-vibe-fm_20261029_1428/All%20Roads%20Lead%20To%20Disco.mp3" },
  { title: "Batumi Nights", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Batumi%20Nights.mp3" },
  { title: "Étoiles Dans Les Yeux", src: "https://archive.org/download/al-vibe-fm_20261029_1428/%C3%89toiles%20Dans%20Les%20Yeux.mp3" },
  { title: "Beyonce The Fog", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Beyonce%20The%20Fog.mp3" },
  { title: "Brilla", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Brilla.mp3" },
  { title: "Call From The Deep", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Call%20From%20The%20Deep.mp3" },
  { title: "Carousel Of Power", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Carousel%20Of%20Power.mp3" },
  { title: "Celebramos La Vida", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Celebramos%20La%20Vida.mp3" },
  { title: "Chop Chop Lollipop", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Chop%20Chop%20Lollipop.mp3" },
  { title: "Deluvision", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Deluvision.mp3" },
  { title: "Don't Go", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Don%27t%20Go.mp3" },
  { title: "Dream Way", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Dream%20Way.mp3" },
  { title: "Every Day Like A Prize", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Every%20Day%20Like%20A%20Prize.mp3" },
  { title: "Feel The Power", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Feel%20The%20Power.mp3" },
  { title: "Good Life", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Good%20Life.mp3" },
  { title: "Gravity", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Gravity.mp3" },
  { title: "Heartbeat Anthem", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Heartbeat%20Anthem.mp3" },
  { title: "I WANNA FEEL", src: "https://archive.org/download/al-vibe-fm_20261029_1428/I%20WANNA%20FEEL.mp3" },
  { title: "Ibiza Stole My Soul", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Ibiza%20Stole%20My%20Soul.mp3" },
  { title: "Sunshine", src: "https://archive.org/download/al-vibe-fm_20261029_1428/Sunshine.mp3" }
];

// Izveido Top 20 sarakstu HTML
const topContainer = document.getElementById('top20Container');
songs.forEach((song, index) => {
  const item = document.createElement('div');
  item.className = 'top-item';
  item.onclick = () => playSpecificSong(index);
  item.innerHTML = `
    <span class="rank">${index + 1}.</span>
    <div class="song"><div class="title">${song.title}</div></div>
    <button class="vote-btn" onclick="event.stopPropagation(); toggleVote(this)">♥</button>
  `;
  topContainer.appendChild(item);
});

let audio = new Audio();
let playBtn = document.getElementById('playBtn');
let path = playBtn.querySelector('path');
let trackTitle = document.getElementById('currentTrackTitle');
let trackMeta = document.getElementById('currentTrackMeta');
let liveBadge = document.getElementById('liveBadge');
let volumeSlider = document.getElementById('volumeSlider');

audio.volume = volumeSlider.value;
volumeSlider.addEventListener('input', (e) => {
  audio.volume = e.target.value;
});

let currentSongIndex = 0;
let songsPlayedSinceJingle = 0;
let jingleIndex = 0;
let isPlayingJingle = false;

// Pulkstenis un grafika aktīvais raidījums
function updateClockAndSchedule() {
  const now = new Date();
  const hours = now.getHours();
  document.getElementById('liveClock').textContent = now.toTimeString().split(' ')[0];

  document.querySelectorAll('.schedule-item').forEach(item => {
    const start = parseInt(item.dataset.start);
    const end = parseInt(item.dataset.end);
    let isActive = (start < end) ? (hours >= start && hours < end) : (hours >= start || hours < end);
    if (isActive) item.classList.add('active');
    else item.classList.remove('active');
  });
}
setInterval(updateClockAndSchedule, 1000);
updateClockAndSchedule();

function checkHourlyJingle() {
  const now = new Date();
  if (now.getMinutes() === 0) {
    isPlayingJingle = true;
    return 3; // 4. džingls stundas sākumā
  }
  return null;
}

function playTrack(trackObj, isJingle = false) {
  audio.src = trackObj.src;
  trackTitle.textContent = trackObj.title;
  trackMeta.textContent = isJingle ? "AL VIBE FM • JINGLE" : "AL VIBE FM • 24/7 STREAM";
  
  audio.play().then(() => {
    liveBadge.classList.add('active');
    path.setAttribute('d', 'M6 4h4v16H6zm8 0h4v16h-4z');
  }).catch(e => console.log("Atskaņošana bloķēta:", e));
}

function playNext() {
  if (!isPlayingJingle && songsPlayedSinceJingle >= 4) {
    isPlayingJingle = true;
    let track = jingles[jingleIndex];
    jingleIndex = (jingleIndex + 1) % jingles.length;
    songsPlayedSinceJingle = 0;
    playTrack(track, true);
  } else {
    let hourlyJingleIdx = checkHourlyJingle();
    if (hourlyJingleIdx !== null && !isPlayingJingle) {
      isPlayingJingle = true;
      playTrack(jingles[hourlyJingleIdx], true);
    } else {
      isPlayingJingle = false;
      let track = songs[currentSongIndex];
      currentSongIndex = (currentSongIndex + 1) % songs.length;
      songsPlayedSinceJingle++;
      playTrack(track, false);
    }
  }
}

function playSpecificSong(index) {
  currentSongIndex = index;
  isPlayingJingle = false;
  songsPlayedSinceJingle++;
  playTrack(songs[index], false);
}

audio.addEventListener('ended', playNext);

playBtn.addEventListener('click', function() {
  if (audio.paused) {
    if (!audio.src || audio.src === window.location.href) {
      playNext();
    } else {
      audio.play().then(() => {
        liveBadge.classList.add('active');
        path.setAttribute('d', 'M6 4h4v16H6zm8 0h4v16h-4z');
      });
    }
  } else {
    audio.pause();
    liveBadge.classList.remove('active');
    path.setAttribute('d', 'M8 5v14l11-7z');
  }
});

function toggleVote(btn) {
  btn.classList.toggle('voted');
  btn.textContent = btn.classList.contains('voted') ? '♥' : '♡';
}

// Izvēlnes vadība
const menuOverlay = document.getElementById('menuOverlay');
document.getElementById('menuBtn').addEventListener('click', () => {
  menuOverlay.style.display = 'flex';
});
menuOverlay.addEventListener('click', (e) => {
  if (e.target === menuOverlay) menuOverlay.style.display = 'none';
});
function closeMenu() {
  menuOverlay.style.display = 'none';
}
</script>
