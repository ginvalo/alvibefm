const player = document.getElementById("audio-player");
const playBtn = document.getElementById("play-btn");
const showTitle = document.getElementById("show-title");
const trackName = document.getElementById("track-name");

function getScheduleByHour(hour) {
    if (hour >= 7 && hour < 11) return { name: "VIBE MORNING", list: playlists.morning };
    if (hour >= 11 && hour < 17) return { name: "VIBE DAYTIME", list: playlists.daytime };
    if (hour >= 17 && hour < 20) return { name: "VIBE DRIVE", list: playlists.drive };
    if (hour >= 20 && hour < 22) return { name: "VIBE NIGHT", list: playlists.night };
    if (hour >= 22 && hour < 23) return { name: "VIBE LOVE", list: playlists.love };
    if (hour >= 23 || hour < 2) return { name: "VIBE CLUB", list: playlists.club };
    return { name: "VIBE AFTER DARK", list: playlists.afterDark };
}

function syncAndPlay() {
    const now = new Date();
    const currentHour = now.getHours();
    const currentSchedule = getScheduleByHour(currentHour);
    showTitle.innerText = currentSchedule.name;

    const avgTrackDuration = 210;
    const totalItemsInHour = currentSchedule.list.length;
    const minutesIntoHour = now.getMinutes() * 60 + now.getSeconds();
    
    if (minutesIntoHour < 20 && now.getMinutes() === 0) {
        player.src = baseUrl + topOfHourJingle;
        trackName.innerText = "⚡ AL VIBE FM — Top of the Hour";
        player.currentTime = minutesIntoHour;
        player.play();
        return;
    }

    const trackIndex = Math.floor(minutesIntoHour / avgTrackDuration) % totalItemsInHour;
    const track = currentSchedule.list[trackIndex];
    const secondsIntoTrack = minutesIntoHour % avgTrackDuration;

    player.src = baseUrl + track.file;
    trackName.innerText = track.title;
    
    player.onloadedmetadata = function() {
        if (secondsIntoTrack < player.duration) {
            player.currentTime = secondsIntoTrack;
        }
        player.play().catch(e => console.log("Autoplay blocked:", e));
    };
}

player.addEventListener("ended", syncAndPlay);

function togglePlay() {
    if (player.paused) {
        syncAndPlay();
        playBtn.innerText = "PAUSE";
    } else {
        player.pause();
        playBtn.innerText = "PLAY";
    }
}
