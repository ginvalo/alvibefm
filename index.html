<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alvibe FM - Your Rhythm, Your Music</title>
    
    <!-- PWA manifest and theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0000">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #a0aec0;
            margin-bottom: 30px;
        }
        audio {
            width: 100%;
            margin-top: 20px;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #718096;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AL VIBE FM</h1>
        <p>Your Rhythm. Your Music. Live Stream.</p>
        
        <!-- Audio Stream Player (Autoplay enabled, controls active) -->
        <audio id="radioStream" controls autoplay src="https://alvibefm.com/stream"></audio>

        <div class="footer">
            Made by GINVALO
        </div>
    </div>

    <script>
        // Register PWA Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        // Keep audio playing in background / lock screen via Media Session API
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Alvibe FM Live',
                artist: 'Made by GINVALO',
                album: 'Live Radio Stream',
                artwork: [
                    { src: '1793047512009.jpg', sizes: '512x512', type: 'image/jpeg' }
                ]
            });
        }
    </script>

</body>
</html>
