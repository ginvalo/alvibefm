<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL VIBE FM - Atskaņotājs</title>
    <!-- Tailwind CSS modernam dizainam -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome ikonām -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Atskaņotāja konteiners -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden p-6">
        
        <!-- Galvene -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black tracking-wider text-amber-400">AL VIBE FM</h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Džinglu atskaņotājs</p>
        </div>

        <!-- Pašreizējā celiņa vizuālais logs -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 mb-6 text-center">
            <div id="track-title" class="text-lg font-semibold text-slate-200 truncate">Izvēlies džinglu</div>
            <div id="track-time" class="text-xs text-slate-500 mt-1">00:00 / 00:00</div>
        </div>

        <!-- Progresa josla -->
        <div class="mb-6">
            <input type="range" id="progress-bar" value="0" max="100" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500">
        </div>

        <!-- Vadības pogas -->
        <div class="flex items-center justify-center space-x-6 mb-8">
            <button id="prev-btn" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-200 transition">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="play-btn" class="w-16 h-16 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center text-xl shadow-lg transition transform hover:scale-105">
                <i id="play-icon" class="fa-solid fa-play ml-0.5"></i>
            </button>
            <button id="next-btn" class="w-12 h-12 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-200 transition">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <!-- Skaļuma kontrole -->
        <div class="flex items-center space-x-3 mb-6 px-2">
            <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
            <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" class="w-full h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500">
        </div>

        <!-- Playlist (Saraksts) -->
        <div class="border-t border-slate-800 pt-4">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Džinglu saraksts</h2>
            <ul id="playlist" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <!-- JavaScript dinamiski ievietos sarakstu -->
            </ul>
        </div>
    </div>

    <!-- Atskaņotāja loģika -->
    <script>
        const audio = new Audio();
        
        // Četri džingli ar tiešajām Archive.org saitēm
        const playlist = [
            { title: "Al Vibe Fm 1", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%201.mp3" },
            { title: "Al Vibe Fm 2", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%202.mp3" },
            { title: "Al Vibe Fm 3", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%203.mp3" },
            { title: "Al Vibe Fm 4", src: "https://archive.org/download/al-vibe-fm_20261029_1311/Al%20Vibe%20Fm%204.mp3" }
        ];

        let currentTrackIndex = 0;

        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackTitle = document.getElementById('track-title');
        const trackTime = document.getElementById('track-time');
        const progressBar = document.getElementById('progress-bar');
        const volumeBar = document.getElementById('volume-bar');
        const playlistEl = document.getElementById('playlist');

        function initPlayer() {
            renderPlaylist();
            loadTrack(currentTrackIndex);
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = `p-3 rounded-xl cursor-pointer text-sm flex items-center justify-between transition ${index === currentTrackIndex ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : 'bg-slate-950/50 hover:bg-slate-800 text-slate-300'}`;
                li.innerHTML = `<span>${track.title}</span> <i class="fa-solid fa-music text-xs opacity-50"></i>`;
                li.onclick = () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    playAudio();
                };
                playlistEl.appendChild(li);
            });
        }

        function loadTrack(index) {
            audio.src = playlist[index].src;
            trackTitle.textContent = playlist[index].title;
            renderPlaylist();
        }

        function playAudio() {
            audio.play();
            playIcon.className = "fa-solid fa-pause";
        }

        function pauseAudio() {
            audio.pause();
            playIcon.className = "fa-solid fa-play ml-0.5";
        }

        playBtn.onclick = () => {
            if (audio.paused) {
                playAudio();
            } else {
                pauseAudio();
            }
        };

        nextBtn.onclick = () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playAudio();
        };

        prevBtn.onclick = () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playAudio();
        };

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progress;
                trackTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        };

        progressBar.oninput = (e) => {
            const time = (e.target.value / 100) * audio.duration;
            audio.currentTime = time;
        };

        volumeBar.oninput = (e) => {
            audio.volume = e.target.value;
        };

        audio.onended = () => {
            nextBtn.click();
        };

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
        }

        initPlayer();
    </script>
</body>
</html>
